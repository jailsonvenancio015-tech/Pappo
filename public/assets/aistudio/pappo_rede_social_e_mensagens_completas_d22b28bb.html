<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#7c5cff">
<title>Pappo</title>
<style>
:root{
  --bg:#f6f6fa;--card:#ffffff;--ink:#16161d;--mut:#74748a;--line:#e9e9f1;
  --acc:#7c5cff;--grad:linear-gradient(135deg,#7c5cff,#ff5c93);
  --sh:0 8px 28px rgba(18,18,28,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#0b0b10;--card:#14141b;--ink:#f3f3f8;--mut:#8b8ba0;--line:#22222c;--sh:0 8px 28px rgba(0,0,0,.35)}
}
:root[data-theme=dark]{--bg:#0b0b10;--card:#14141b;--ink:#f3f3f8;--mut:#8b8ba0;--line:#22222c;--sh:0 8px 28px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.45 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);overflow:hidden;
  -webkit-tap-highlight-color:transparent;overflow-wrap:anywhere;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{
  font:inherit;color:inherit;background:var(--bg);
  border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%;outline:0;resize:none
}
input:focus,textarea:focus{border-color:var(--acc)}
input[type=range]{padding:0;accent-color:var(--acc)}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--acc);flex:none}
small,.mut{color:var(--mut)}.ctr{text-align:center;padding:36px 0}
img,video,canvas{max-width:100%}

/* Layout Principal */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
#app.wide{grid-template-columns:236px minmax(0,1fr) 320px}
#app.solo{
  display:flex;overflow-y:auto;padding:20px 12px;
  background:radial-gradient(70% 50% at 50% 0,color-mix(in srgb,var(--acc) 22%,transparent),transparent),
             radial-gradient(60% 40% at 100% 100%,color-mix(in srgb,#ff5c93 14%,transparent),transparent);
}

/* Navegação */
nav{display:flex;flex-direction:column;gap:4px;padding:20px 14px;border-right:1px solid var(--line);background:var(--card);z-index:20}
.logo{font-size:27px;font-weight:800;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding:4px 12px 18px}
.logo.big{font-size:54px;text-align:center;padding:0}
.ni{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--mut);position:relative;font-weight:600;transition:.15s}
.ni:hover,.ni.on{background:var(--bg)}.ni.on{color:var(--ink)}
.ni.create{background:var(--grad);color:#fff;margin:6px 0;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 32%,transparent)}
.ni.create:hover{opacity:.94}
.bdg{position:absolute;left:28px;top:6px;min-width:18px;height:18px;border-radius:9px;background:#ff3b6b;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700}

main{overflow-y:auto;overflow-x:hidden;min-height:0;scroll-behavior:smooth}
.w{max-width:650px;margin:0 auto;padding:20px 16px 48px}
h2{font-size:22px;letter-spacing:-.02em;margin-bottom:14px}
h3{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 10px}

/* Cards e Botões */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:16px;overflow:hidden;position:relative;box-shadow:var(--sh)}
.pad{padding:16px}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.grow>b,.grow>small{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;user-select:none;position:relative}
.av .onl{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#19c37d;border:2px solid var(--card)}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;transition:.15s}.ib:hover{background:var(--bg)}.ib:active{transform:scale(.92)}
.pri{background:var(--grad);color:#fff;border-radius:14px;padding:11px 18px;font-weight:700;transition:.15s}.pri:active{transform:scale(.98)}
.ib.pri{border-radius:50%;padding:0}
.btn{border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn:hover{border-color:var(--acc)}.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.danger{color:#ff3b6b;border-color:#ff3b6b55}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tg{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.tg i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px #0003}
.tg.on{background:var(--acc)}.tg.on i{left:21px}

/* Stories & Destaques */
.sb{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 16px;scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
.st{display:grid;gap:6px;justify-items:center;width:70px;flex:none;font-size:12px}
.st span{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:3px;border-radius:50%;background:var(--grad)}.ring.seen{background:var(--line)}
.ring .av,.ring .add{border:3px solid var(--bg)}
.add{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--acc)}

/* Feed, Carrossel e Enquetes */
.pm{width:100%;display:block;cursor:zoom-in;max-height:min(82dvh,860px);object-fit:cover}
.carw{position:relative}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.car::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;width:100%;scroll-snap-align:center;object-fit:cover;cursor:zoom-in;max-height:min(82dvh,860px)}
.cn{position:absolute;top:12px;right:12px;background:#0009;color:#fff;border-radius:99px;padding:4px 10px;font-size:12px;font-style:normal;font-weight:700;backdrop-filter:blur(6px)}
.cnav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:#0007;color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px);z-index:2}
.cnav.l{left:10px}.cnav.r{right:10px}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:#0005;padding:4px 8px;border-radius:99px;backdrop-filter:blur(4px)}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff6;transition:.2s}.dots i.on{background:#fff;width:14px;border-radius:4px}

.tc{aspect-ratio:1;display:grid;place-items:center;padding:28px;text-align:center;font-size:24px;font-weight:700;color:#fff;cursor:pointer;position:relative;overflow:hidden}
.tc p{max-width:100%;max-height:100%;overflow:auto;scrollbar-width:none}
.tc textarea{background:none;border:0;color:#fff;font-size:24px;font-weight:700;text-align:center;height:100%}
.tc.big{width:min(92%,520px);border-radius:24px}

.poll{padding:14px;display:grid;gap:8px;background:color-mix(in srgb,var(--acc) 5%,var(--bg));margin:0 16px 8px;border-radius:18px;border:1px solid var(--line)}
.poll.inchat{margin:4px 0 0;min-width:220px;background:var(--bg);color:var(--ink)}
.popt{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;padding:9px 12px;text-align:left;background:var(--card);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.popt b,.popt small{position:relative;z-index:1}
.popt .bar{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--acc) 24%,transparent);transition:width .35s ease}
.popt.on{border-color:var(--acc)}

.vw{position:relative;background:#000}.vw video,.pv{width:100%;display:block;max-height:640px}
.vw.reel video{aspect-ratio:9/16;max-height:min(80dvh,780px);margin:0 auto;object-fit:cover}
.vw .mu{position:absolute;right:10px;top:10px;background:#0008;color:#fff}
.au{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:10px 12px;background:var(--bg);border-radius:16px}
.au div{flex:1;min-width:0}.au small{display:block}
.ac{display:flex;gap:4px;padding:8px 10px}.ac button{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;color:var(--mut);font-weight:600}
.ac button.on{color:#ff3b6b}.ac button.on svg{fill:currentColor}.ac [data-a=rp].on svg{fill:none}.ac [data-a=rp].on{color:#2bb3a3}.ac .sp{flex:1}
.cap{padding:0 16px 14px}
a[data-a]{color:var(--acc);cursor:pointer;font-weight:600}
.hb{position:absolute;left:50%;top:40%;font-size:96px;color:#fff;font-style:normal;pointer-events:none;text-shadow:0 4px 24px #0006;animation:hb .8s ease-out forwards}
@keyframes hb{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}

/* Modais & Editor */
.mod{position:fixed;inset:0;z-index:80;background:#0008;display:grid;place-items:center;padding:12px;backdrop-filter:blur(6px)}
.sheet{background:var(--card);border-radius:26px;width:min(880px,100%);max-height:94dvh;overflow:auto;box-shadow:0 24px 64px #0004}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;position:sticky;top:0;background:var(--card);z-index:4;border-bottom:1px solid var(--line)}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
.pb{display:grid;gap:8px;justify-items:center;padding:28px 10px;border:1.5px dashed var(--line);border-radius:20px;cursor:pointer;text-align:center;transition:.15s}
.pb:hover{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 5%,transparent)}
.eg{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;padding:16px}
.ctl{display:grid;gap:6px;align-content:start}
canvas{width:100%;border-radius:18px;display:block}
#cv{max-height:66dvh;width:auto;max-width:100%;margin:0 auto;box-shadow:0 6px 24px #0002}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.15s}.sw i.on{border-color:var(--ink);transform:scale(1.1)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.strip img{width:54px;height:54px;object-fit:cover;border-radius:10px;border:2px solid transparent;flex:none;cursor:pointer}
.strip img.on{border-color:var(--acc)}
.add2{width:54px;height:54px;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;cursor:pointer;flex:none;font-size:20px;color:var(--acc)}

/* Visualizador & Stories */
.vo{position:fixed;inset:0;z-index:85;background:#000f;display:flex}
.vm{flex:1;min-width:0;position:relative;display:grid;place-items:center;overflow:hidden;touch-action:none}
.vm img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .15s;user-select:none}
.vm video{max-width:100%;max-height:100%}
.fl{position:absolute;left:14px;top:14px;background:#fff2;color:#fff}
.zc{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;color:#fff}
.zc .ib,.zc b{background:#fff2;border-radius:99px;backdrop-filter:blur(8px)}.zc b{padding:9px 14px;font-size:12px;min-width:56px;text-align:center}.zc .ib{color:#fff}
.va{width:380px;display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--line)}
.va header,.va footer{display:flex;gap:10px;align-items:center;padding:14px}.va footer{border-top:1px solid var(--line)}.va header{border-bottom:1px solid var(--line)}
.vl{flex:1;overflow-y:auto;padding:14px;display:grid;gap:14px;align-content:start}

.so{position:fixed;inset:0;z-index:90;background:#000;display:grid;place-items:center;color:#fff;user-select:none}
.so img{max-width:100%;max-height:100%;object-fit:contain}
.sp{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:4px;z-index:3}
.sp b{flex:1;height:3px;border-radius:2px;background:#fff4;overflow:hidden}.sp i{display:block;height:100%;background:#fff}
.sh{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:10px;align-items:center;z-index:3}.sh span{flex:1;font-size:12px;opacity:.75}
.z{position:absolute;top:70px;bottom:70px;width:40%;z-index:2}.z.l{left:0}.z.r{right:0}
.sr{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:6px;align-items:center}
.sr input{background:#fff2;border-color:#fff5;color:#fff;border-radius:99px}.sr button{font-size:22px;padding:4px}

/* Reels em Tela Cheia */
.reels-wrap{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
.reel-item{height:100%;scroll-snap-align:start;position:relative;display:grid;place-items:center;background:#000;color:#fff}
.reel-item video{width:100%;height:100%;max-width:520px;object-fit:cover}
.reel-ov{position:absolute;bottom:20px;left:16px;right:72px;max-width:460px;margin:0 auto;text-shadow:0 2px 10px #000a;z-index:2}
.reel-act{position:absolute;right:16px;bottom:24px;display:grid;gap:14px;justify-items:center;z-index:2}
.reel-act button{color:#fff;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:700;text-shadow:0 2px 8px #0009}
.reel-act .ib{background:#fff2;backdrop-filter:blur(8px);color:#fff}
.reel-act .on svg{fill:#ff3b6b;stroke:#ff3b6b}

/* ================= CHAT SUPER COMPLETO (WhatsApp + Messenger + Telegram) ================= */
.chat{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%}
.cl{border-right:1px solid var(--line);padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.ctabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ctabs::-webkit-scrollbar{display:none}
.cr{display:flex;gap:11px;align-items:center;padding:10px;border-radius:16px;cursor:pointer;width:100%;text-align:left;transition:.15s;position:relative}
.cr:hover,.cr.on{background:var(--bg)}
.ubdg{min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}

.ct{display:flex;flex-direction:column;min-height:0;position:relative}
.ct>header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);z-index:5}
.pinbar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:color-mix(in srgb,var(--acc) 10%,var(--card));border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.sbar-chat{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.sbar-chat input{padding:7px 12px;border-radius:99px;font-size:13px}

#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative}
.sysmsg{align-self:center;background:color-mix(in srgb,var(--ink) 7%,var(--card));color:var(--mut);font-size:12px;padding:5px 12px;border-radius:99px;margin:4px 0;text-align:center;max-width:85%}
.mrow{display:flex;flex-direction:column;max-width:80%;align-self:flex-start;position:relative}
.mrow.me{align-self:flex-end;align-items:flex-end}
.bb{padding:9px 13px;border-radius:20px 20px 20px 6px;background:var(--card);border:1px solid var(--line);word-break:break-word;box-shadow:0 1px 3px #0001;position:relative}
.mrow.me .bb{border-radius:20px 20px 6px 20px;background:var(--bc,var(--grad));color:#fff;border:0}
.bb.hl{outline:2px solid #ffb02e}
.bb small{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:10px;opacity:.7;margin-top:3px}
.sn{display:block;font-weight:700;font-size:11.5px;margin-bottom:2px;color:var(--acc)}
.qbox{font-size:12px;padding:6px 10px;border-radius:11px;background:#0001;border-left:3px solid var(--acc);margin-bottom:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.me .qbox{background:#fff2;border-left-color:#fff}

.mact{display:flex;gap:3px;opacity:0;transition:.15s;margin-top:3px;flex-wrap:wrap}
.mrow:hover .mact,.mrow:focus-within .mact{opacity:1}
.mact button{font-size:12px;padding:3px 7px;border-radius:99px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 6px #0001}
.mact button:hover{border-color:var(--acc)}
.rx{display:inline-flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:1px 7px;font-size:12px;margin-top:-6px;z-index:1;box-shadow:0 2px 6px #0001}

.rbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);border-top:1px solid var(--line);border-left:4px solid var(--acc);font-size:13px}
.cf{display:flex;gap:5px;padding:9px 12px;border-top:1px solid var(--line);background:var(--card);align-items:center}
.cf input#ci{flex:1;min-width:0;border-radius:99px;padding:10px 15px}
.back{display:none}
.cpan{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);max-height:220px;overflow:auto}
.cpan>button{font-size:28px;padding:4px 6px;border-radius:12px}.cpan>button:hover{background:var(--bg)}
.cpan .sbar{width:100%;display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.sk{width:62px;height:62px;object-fit:contain}.sk.big{width:136px;height:136px}
.stk{font-size:62px;line-height:1.1}
.sg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.sgi{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;place-items:center;cursor:pointer}
.sgi img{width:100%;aspect-ratio:1;object-fit:contain}
.sgi input{position:absolute;top:6px;left:6px}
.ci{max-width:min(240px,70vw);border-radius:14px;display:block}
.bb audio{max-width:min(230px,60vw);height:38px}
.fl2{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none}
.once-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:#fff2;font-weight:700;font-size:13px}
.mrow:not(.me) .once-btn{background:var(--bg);color:var(--acc)}
.loc-card{display:grid;gap:4px;min-width:190px}
.loc-map{height:76px;border-radius:10px;background:linear-gradient(135deg,#2bb3a3,#5cc8ff);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}

.rec{background:#ff3b6b!important;color:#fff;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.55}}
.s-bold{font-weight:800}.s-mono{font-family:ui-monospace,Menlo,monospace}.s-big{font-size:1.5em;line-height:1.2}
.s-grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.mrow.me .s-grad{background:none;color:#fff;text-shadow:0 0 14px #fffa}

/* Papéis de parede do Chat */
.wp1{background-image:radial-gradient(var(--line) 1.3px,transparent 1.3px);background-size:18px 18px}
.wp2{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 15%,var(--bg)),var(--bg))}
.wp3{background:linear-gradient(135deg,color-mix(in srgb,#ff5c93 14%,var(--bg)),color-mix(in srgb,#7c5cff 14%,var(--bg)))}
.wp4{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--acc) 4%,var(--bg)) 0 12px,var(--bg) 12px 24px)}

@keyframes slam{0%{transform:scale(2) translateY(-10px);opacity:0}60%{transform:scale(.94);opacity:1}100%{transform:scale(1)}}
@keyframes loud{0%,100%{transform:scale(1)}25%{transform:scale(1.12) rotate(-2deg)}55%{transform:scale(1.14) rotate(2deg)}}
@keyframes gentle{0%{transform:scale(.88) translateY(8px);opacity:.2}100%{transform:scale(1);opacity:1}}
.fx-slam{animation:slam .5s cubic-bezier(.16,1,.3,1) both}.fx-loud{animation:loud .6s ease both}.fx-gentle{animation:gentle .7s ease both}
.invisible-ink-blur{filter:blur(7px);cursor:pointer;transition:filter .35s}

/* Efeito de tela cheia (Messenger/iMessage) */
.screenfx{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.screenfx span{position:absolute;top:-30px;font-size:26px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:0}}

/* Perfil & Grade */
.cov{height:142px;border-radius:22px;position:relative;overflow:hidden}
.phd{display:grid;justify-items:center;gap:4px;text-align:center;position:relative;margin-top:-54px;padding-top:12px}
.phd .av{border:4px solid var(--bg);box-shadow:0 6px 20px #0002}
.note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;font-size:13px;max-width:260px;box-shadow:0 4px 14px #0001;margin-bottom:4px}
.bio{white-space:pre-wrap;max-width:500px;margin:6px 0}
.pi{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;color:var(--mut);font-size:13px;margin:4px 0}
.pi span{display:inline-flex;gap:4px;align-items:center}
.lks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px;margin-top:8px}
.lk{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;text-decoration:none}
.lk:hover{border-color:var(--acc);color:var(--acc)}
.stats{display:flex;gap:28px;margin:14px 0;justify-content:center;text-align:center}.stats b{display:block;font-size:18px}
.row.cen{justify-content:center;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:18px;overflow:hidden}
.grid>*{aspect-ratio:1;object-fit:cover;width:100%;cursor:pointer;position:relative;display:grid;place-items:center;color:#fff;font-weight:700;padding:8px;font-size:13px;text-align:center;overflow:hidden}
.grid.a45>*{aspect-ratio:4/5}
.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .2s}
.gt:hover img{transform:scale(1.03)}
.gb{position:absolute;top:6px;left:6px;font-style:normal;font-size:12px;background:#0008;border-radius:8px;padding:2px 6px;color:#fff;backdrop-filter:blur(4px)}
.gb.r{left:auto;right:6px}
.gt.on{outline:3px solid var(--acc);outline-offset:-3px}

/* Login & Contas */
.au2{margin:auto;width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px 22px;box-shadow:0 20px 60px #0000001a;display:grid;gap:14px;text-align:center}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px}
.seg2 button{padding:10px;border-radius:11px;font-weight:700;color:var(--mut)}.seg2 button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px #0001}
.fld{display:grid;gap:10px}
.at{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 14px}
.at:focus-within{border-color:var(--acc)}.at input{border:0;background:none;padding-left:4px}
.vis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vis button{display:grid;gap:4px;justify-items:center;padding:12px 8px;border:1.5px solid var(--line);border-radius:16px;font-size:12px;color:var(--mut)}
.vis button b{color:var(--ink);font-size:14px}.vis button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.dev{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:14px;background:var(--bg)}
.err{color:#ff3b6b;min-height:18px;font-size:13px}
.pwb{height:5px;border-radius:3px;background:var(--line);overflow:hidden}.pwb i{display:block;height:100%;width:0;transition:.25s}
.mi{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.lr{margin:6px 0}.lr input{flex:1;min-width:0}

.rp{display:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Responsividade Automática (Celular, Tablet, Notebook, TV) */
@media(min-width:1280px){.rp{display:block;padding:24px 20px;border-left:1px solid var(--line);overflow-y:auto}.sg{display:none}}
@media(min-width:801px) and (max-width:1100px){
  #app,#app.wide{grid-template-columns:76px minmax(0,1fr)}
  nav{align-items:center;padding:16px 8px}.ni span{display:none}.ni{justify-content:center}
  .bdg{left:auto;right:6px}.logo{font-size:0;padding:4px 0 16px}.logo::first-letter{font-size:30px}
  .chat{grid-template-columns:270px minmax(0,1fr)}
}
@media(max-width:800px){
  #app,#app.wide{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  nav{flex-direction:row;order:2;border:0;border-top:1px solid var(--line);padding:4px;justify-content:space-around}
  .logo,.ni span{display:none}.ni{padding:10px 8px}.ni.create{margin:0;border-radius:50%;width:42px;height:42px;justify-content:center}
  .bdg{left:auto;right:4px}
  .chat{grid-template-columns:1fr}.chat.open .cl{display:none}.chat:not(.open) .ct{display:none}.back{display:grid}
  .eg{grid-template-columns:1fr}.pk{grid-template-columns:1fr 1fr;padding:12px}
  .vo{flex-direction:column}.va{width:100%;height:44dvh;border-left:0;border-top:1px solid var(--line)}
  input,textarea{font-size:16px}.w{padding:14px 12px 28px}#toast{bottom:78px}
}
@media(max-width:800px) and (orientation:landscape){
  .vo{flex-direction:row}.va{width:320px;height:auto;border-top:0;border-left:1px solid var(--line)}
}
.rmo *{transition:none!important;animation:none!important}

const hash=async(p,s)=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let h=5381;for(const c of s+p)h=(h*33)^c.charCodeAt(0);return 'f'+(h>>>0)}};
const accSave=async()=>{await vput('__acc',AC);try{localStorage.setItem('pappo:acc',JSON.stringify(AC))}catch{}};
function applyTheme(){
  const d=document.documentElement,a=ACC[S?.ac||0];
  !S||S.theme==='auto'||!S.theme?delete d.dataset.theme:d.dataset.theme=S.theme;
  d.style.setProperty('--acc',a[0]);
  d.style.setProperty('--grad',`linear-gradient(135deg,${a[0]},${a[1]})`);
  d.classList.toggle('rmo',!!(S&&S.rmo));

async function enter(h){

}

function screenEffect(type){
  const ct=$('.ct');if(!ct)return;
  const map={hearts:['💜','❤️','💖','💕'],confetti:['🎉','✨','🎊','🥳'],fire:['🔥','💥','⚡'],stars:['⭐','🌟','✨']};
  const arr=map[type];if(!arr)return;
  const w=document.createElement('div');w.className='screenfx';
  for(let i=0;i<22;i++){
    const s=document.createElement('span');
    s.textContent=arr[i%arr.length];
    s.style.left=Math.random()*95+'%';
    s.style.animationDelay=(Math.random()*.8)+'s';
    s.style.fontSize=(18+Math.random()*16)+'px';
    w.append(s);
  }
  ct.append(w);setTimeout(()=>w.remove(),3200);
}

async function rec(){
  if(MR&&MR.state==='recording'){MR.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true}),c=V.c;
    MR=new MediaRecorder(st);MC=[];
    MR.ondataavailable=e=>MC.push(e.data);
    MR.onstop=()=>{st.getTracks().forEach(t=>t.stop());$('#mic')?.classList.remove('rec');const b=new Blob(MC,{type:MR.mimeType||'audio/webm'});if(V.c===c&&b.size>800){push({k:'aud',b,tx:'🎤 Áudio'});reply()}};
    MR.start();$('#mic').classList.add('rec');
  }catch{toast('Permita o microfone para gravar áudio')}
}

const L=()=>C.ims&&C.ims.length?C.ims:[C.im];
const dim=()=>C.mode==='story'?[1080,1920]:[FM[C.fm|0][1],FM[C.fm|0][2]];
function r1(cv,im){
  const [w,h]=dim(),k=Math.min(1,QD()/1080);
  cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  const x=cv.getContext('2d'),iw=im.naturalWidth,ih=im.naturalHeight;
  const s=Math.max(cv.width/iw,cv.height/ih)*(C.zm||100)/100,dw=iw*s,dh=ih*s;
  x.filter=`${F[C.f|0].css} brightness(${C.b}%) contrast(${C.c}%) saturate(${C.sa||100}%)`;
  x.drawImage(im,(cv.width-dw)*(C.px??50)/100,(cv.height-dh)*(C.py??50)/100,dw,dh);
  x.filter='none';tex(x,cv.width,cv.height,C.t);
}
function draw(){const cv=$('#cv'),im=L()[C.ci|0];if(cv&&im)r1(cv,im)}
function noise(){if(NZ)return NZ;NZ=document.createElement('canvas');NZ.width=NZ.height=160;const x=NZ.getContext('2d'),d=x.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=Math.random()*255;d.data[i+3]=255}x.putImageData(d,0,0);return NZ}
function tex(x,w,h,t){
  if(!t)return;x.save();x.filter='none';let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;
  if(t===1){x.globalCompositeOperation='overlay';x.globalAlpha=.25;x.fillStyle=x.createPattern(noise(),'repeat');x.fillRect(0,0,w,h)}
  if(t===2){x.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<w*h/2500;i++)x.fillRect(r()*w,r()*h,r()*2+.5,r()*2+.5)}
  if(t===3){const g=x.createRadialGradient(w,0,0,w,0,Math.max(w,h)*.8);g.addColorStop(0,'rgba(255,120,60,.6)');g.addColorStop(.5,'rgba(255,60,120,.2)');g.addColorStop(1,'rgba(255,60,120,0)');x.globalCompositeOperation='screen';x.fillStyle=g;x.fillRect(0,0,w,h)}
  if(t===4){x.fillStyle='rgba(0,0,0,.1)';for(let y=0;y<h;y+=4)x.fillRect(0,y,w,1.5)}
  x.restore();
}

async function pub(){

    for(let i=0;i<l.length;i++){r1(cv,l[i]);o.push(cv.toDataURL('image/jpeg',QJ()));await new Promise(r=>setTimeout(r))}
    p.type='image';p.src=o[0];p.ar=+(cv.width/cv.height).toFixed(3);if(o.length>1)p.imgs=o;
  }else if(C.type==='v'){
    p.type='video';await vput(id,C.file);if(C.reel&&!st)p.reel=1;
  }else if(C.type==='poll'){
    const opts=$$('.popi').map(i=>i.value.trim()).filter(Boolean);
    if(opts.length<2)return toast('Adicione pelo menos 2 opções');
    p.type='poll';p.opts=opts.map(t=>({t,v:[]}));
  }else{
    p.type='text';p.bg=C.bg;p.cap=($('#tt').value||'').trim();
    if(!p.cap)return toast('Escreva algo primeiro');
  }

  if(st){
    S.stories.push({id,u:'me',type:p.type==='text'?'text':'image',src:p.src,tx:p.cap,bg:p.bg,t:n,exp:n+(C.dur||24)*36e5,seen:[]});
  }else{
    if(p.type!=='text')p.cap=($('#cap').value||'').trim();

    if(mu){if(!/^https?:\/\//i.test(mu))return toast('O link da música precisa começar com http');p.music=mu}
    S.posts.unshift(p);
  }
  save();close();V={n:p.reel?'reels':'feed'};render();toast(st?'Story publicado!':'Publicado!');
}

function buildSticker(img,shape,border,cb){
  const c=document.createElement('canvas');c.width=c.height=240;
  const x=c.getContext('2d'),s=Math.min(img.naturalWidth,img.naturalHeight);
  const pad=border?16:4,sz=240-pad*2;
  x.save();
  if(shape==='circle'){x.beginPath();x.arc(120,120,sz/2,0,Math.PI*2);x.clip()}
  else if(shape==='round'){const r=36;x.beginPath();x.roundRect(pad,pad,sz,sz,r);x.clip()}
  x.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,pad,pad,sz,sz);
  x.restore();
  if(border){
    x.strokeStyle='#ffffff';x.lineWidth=10;
    if(shape==='circle'){x.beginPath();x.arc(120,120,sz/2,0,Math.PI*2);x.stroke()}
    else{x.beginPath();x.roundRect(pad,pad,sz,sz,shape==='round'?36:6);x.stroke()}
  }
  cb(c.toDataURL('image/png'));
}

  mpin:d=>{const m=(S.chat[V.c]||[]).find(x=>x.id===d.id);if(!m)return;m.pin=!m.pin;save();render();toast(m.pin?'Mensagem fixada no topo 📌':'Desafixada')},
  medit:d=>{
    const m=(S.chat[V.c]||[]).find(x=>x.id===d.id);if(!m)return;

  medok:d=>{const m=(S.chat[V.c]||[]).find(x=>x.id===d.id),tx=$('#medtx').value.trim();if(m&&tx){m.tx=tx;m.ed=1;save();close();paint();toast('Mensagem editada')}},
  mdel1:d=>{S.chat[V.c]=(S.chat[V.c]||[]).filter(x=>x.id!==d.id);save();paint();toast('Mensagem apagada')},
  mfwd:d=>{
    const m=(S.chat[V.c]||[]).find(x=>x.id===d.id);if(!m)return;

    modal(`${mh('Encaminhar mensagem')}<div class="pad" style="display:grid;gap:8px">${targets.map(t=>`<button class="cr" data-a="mfwdto" data-to="${t.id}" data-id="${m.id}"><b>${esc(t.n)}</b></button>`).join('')}</div>`);

    save();close();toast('Mensagem encaminhada!');
  },
  openonce:d=>{
    const m=(S.chat[V.c]||[]).find(x=>x.id===d.id);if(!m||m.opened)return;
    m.opened=1;save();paint();
    modal(`${mh('Visualização única 💣')}<div class="pad ctr"><p style="font-size:20px;font-weight:700;padding:24px">${esc(m.tx)}</p><small class="mut">Esta mensagem foi destruída após a leitura.</small></div>`);
  },

      </div>`;

  sty:d=>{V[d.k]=d.v;$$(`[data-a=sty][data-k=${d.k}]`).forEach(b=>b.classList.toggle('on',b.dataset.v===d.v))},

    push({k:'poll',tx:q,opts:opts.map(t=>({t,v:[]}))});close();reply();
  },
  concenew:()=>modal(`${mh('Mensagem de visualização única 💣')}<div class="pad" style="display:grid;gap:10px"><small class="mut">O destinatário só poderá abrir uma única vez.</small><textarea id="cotx" rows="3" maxlength="250" placeholder="Digite a mensagem secreta…"></textarea><button class="pri" data-a="conceok">Enviar mensagem única</button></div>`),

  /* Figurinhas */
  snew:()=>{
    V.skShape='round';V.skBorder=1;
    modal(`${mh('Criar figurinha')}<div class="pad" style="display:grid;gap:12px">
      <div class="chips">
        <button class="chip on" data-a="sksh" data-v="round">Arredondada</button>
        <button class="chip" data-a="sksh" data-v="circle">Redonda</button>
        <button class="chip" data-a="sksh" data-v="sq">Quadrada</button>
        <button class="chip on" data-a="skbd">Borda branca</button>
      </div>
      <label class="pb">${ic('image',28)}<b>Escolher foto da galeria</b><input type="file" id="sfi" hidden accept="image/*"></label>
      <div class="row"><input id="stx" maxlength="16" placeholder="Ou criar figurinha com texto…"><button class="pri" data-a="stxt">Criar</button></div>
    </div>`);
  },
  sksh:d=>{V.skShape=d.v;$$('[data-a=sksh]').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v))},
  skbd:(d,a)=>{V.skBorder=!V.skBorder;a.classList.toggle('on',!!V.skBorder)},
  stxt:()=>{
    const t=$('#stx').value.trim();if(!t)return toast('Digite um texto');
    const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d');
    let f=86;x.font=`900 ${f}px system-ui`;while(x.measureText(t).width>210&&f>16){f-=4;x.font=`900 ${f}px system-ui`}
    const a=ACC[Math.random()*5|0],g=x.createLinearGradient(0,0,240,0);g.addColorStop(0,a[0]);g.addColorStop(1,a[1]);
    x.textAlign='center';x.textBaseline='middle';
    if(V.skBorder){x.strokeStyle='#fff';x.lineWidth=12;x.strokeText(t,120,120)}
    x.fillStyle=g;x.fillText(t,120,120);
    stks().unshift({id:'k'+Date.now(),src:c.toDataURL('image/png')});save();close();toast('Figurinha criada!');if(V.n==='chat')act.pan({v:'stk'});
  },
  sman:()=>{
    modal(`${mh('Minhas figurinhas ('+stks().length+')')}<div class="pad">
      <div class="sg2">${stks().map(s=>`<label class="sgi"><img src="${s.src}" alt=""><input type="checkbox" value="${s.id}"></label>`).join('')||'<p class="mut ctr">Você ainda não criou figurinhas.</p>'}</div>

      </div>
    </div>`);
  },
  sall:()=>$$('.sg2 input').forEach(i=>i.checked=true),
  sdel:()=>{const ids=$$('.sg2 input:checked').map(i=>i.value);if(!ids.length)return toast('Selecione figurinhas');S.stk=stks().filter(s=>!ids.includes(s.id));save();act.sman();toast('Figurinhas apagadas')},
  rec,
  send:()=>{
    const i=$('#ci'),t=i.value.trim(),k=cc();
    if(!t&&k.quickEmoji){push({k:'stk',tx:k.quickEmoji,sfx:V.sfx||''});V.sfx='';reply();return}
    if(!t)return;
    push({tx:t,st:V.st||'',fx:V.fx||'',sfx:V.sfx||''});
    i.value='';V.sfx='';reply();
  },

      <div>
        <small class="mut">Participantes e Apelidos</small>

    if(i<0){g.admins.push(d.id);(S.chat[V.c]=S.chat[V.c]||[]).push({m:'sys',id:'s'+Date.now(),tx:`${usr(d.id).n} agora é admin do grupo`,t:Date.now()})}

  cset:()=>{

      ${g?`<div class="row">${av({n:g.n,c:g.c,img:g.img},52)}<label class="btn">Foto do grupo<input type="file" id="gfi" hidden accept="image/*"></label></div>`:''}

      <div class="sw">${ACC.map((a,i)=>`<i class="${k.ci===i?'on':''}" data-a="ccol" data-i="${i}" style="background:linear-gradient(135deg,${a[0]},${a[1]})"></i>`).join('')}</div>

      <small>Papel de parede da conversa</small>
      <div class="chips">${['Padrão','Pontos','Degradê','Aurora','Listras'].map((l,i)=>`<button class="chip ${(k.wp||0)===i?'on':''}" data-a="cwp" data-i="${i}">${l}</button>`).join('')}</div>

      <small>Reação rápida (Messenger)</small>
      <div class="chips">${['','👍','❤️','😂','🔥','💜'].map(e=>`<button class="chip ${(k.quickEmoji||'')===e?'on':''}" data-a="cqem" data-e="${e}">${e||'Desativado'}</button>`).join('')}</div>

      <small>Mensagens temporárias (WhatsApp)</small>
      <div class="chips">${[[0,'Desativadas'],[15,'15 seg'],[60,'1 min'],[86400,'24 horas']].map(([v,l])=>`<button class="chip ${(g?g.disappear:k.disappear||0)===v?'on':''}" data-a="cdis" data-v="${v}">${l}</button>`).join('')}</div>

      ${g?`
        <div class="row"><b class="grow">Apenas admins enviam mensagens</b><button class="tg ${g.adminOnly?'on':''}" data-a="gflag" data-k="adminOnly"><i></i></button></div>
        <small>Apelidos dos membros no grupo</small>
        <div style="display:grid;gap:6px">${g.mem.map(id=>`<div class="row"><span style="width:90px">${esc(usr(id).n.split(' ')[0])}</span><input class="gnick" data-id="${id}" value="${esc(g.nicks?.[id]||'')}" placeholder="Apelido…"></div>`).join('')}</div>
        <small>Participantes</small>
        <div id="gm">${U.map(u=>`<label class="mi">${av(u,34)}<span class="grow">${esc(u.n)}</span><input type="checkbox" value="${u.id}" ${g.mem.includes(u.id)?'checked':''}></label>`).join('')}</div>
      `:''}

      <div class="row"><b class="grow">Fixar conversa no topo</b><button class="tg ${k.pin?'on':''}" data-a="cflag" data-k="pin"><i></i></button></div>
      <div class="row"><b class="grow">Silenciar notificações</b><button class="tg ${k.muted?'on':''}" data-a="cflag" data-k="muted"><i></i></button></div>
      <button class="pri" data-a="csave">Salvar alterações</button>
      <button class="btn danger" data-a="cclr">${g?'Sair e apagar grupo':'Limpar mensagens'}</button>
    </div>`);
  },
  gemo:d=>{const g=S.groups?.[V.c];if(g){g.themeEmoji=d.e;$$('[data-a=gemo]').forEach(b=>b.classList.toggle('on',b.dataset.e===d.e))}},
  gflag:(d,a)=>{const g=S.groups?.[V.c];if(g){g[d.k]=!g[d.k];a.classList.toggle('on',g[d.k])}},
  cqem:d=>{cc().quickEmoji=d.e;$$('[data-a=cqem]').forEach(b=>b.classList.toggle('on',b.dataset.e===d.e))},
  cdis:d=>{const g=S.groups?.[V.c];if(g)g.disappear=+d.v;else cc().disappear=+d.v;$$('[data-a=cdis]').forEach(b=>b.classList.toggle('on',+b.dataset.v===+d.v))},
  ccol:d=>{cc().ci=+d.i;$$('[data-a=ccol]').forEach(b=>b.classList.toggle('on',+b.dataset.i===+d.i))},
  cwp:d=>{cc().wp=+d.i;$$('[data-a=cwp]').forEach(b=>b.classList.toggle('on',+b.dataset.i===+d.i))},
  cflag:(d,a)=>{const k=cc();k[d.k]=!k[d.k];a.classList.toggle('on',k[d.k])},
  csave:()=>{
    const g=S.groups?.[V.c],n=$('#cn').value.trim();
    if(g){
      if(n&&n!==g.n){g.n=n;(S.chat[V.c]=S.chat[V.c]||[]).push({m:'sys',id:'s'+Date.now(),tx:`Você alterou o nome do grupo para "${n}"`,t:Date.now()})}
      g.desc=$('#gdesc2').value.trim();
      g.rules=$('#grules2').value.trim();
      g.nicks={};$$('.gnick').forEach(i=>{if(i.value.trim())g.nicks[i.dataset.id]=i.value.trim()});
      g.mem=$$('#gm input:checked').map(i=>i.value);
    }else if(n){cc().nick=n}
    save();close();render();toast('Personalização salva!');
  },
  cclr:()=>{
    if(!confirm('Tem certeza?'))return;
    const c=V.c;S.chat[c]=[];
    if(S.groups?.[c]){delete S.groups[c];delete S.chat[c];V={n:'chat'}}
    save();close();render();
  },

  /* Gerenciador de Conteúdo & Outros */
  mgr:d=>{
    V.mg=d.v||'p';const k=V.mg;
    const it={p:S.posts.filter(p=>p.u==='me').map(p=>[p.id,(p.type==='image'?'🖼 Foto':p.type==='video'?'🎬 Vídeo':p.type==='poll'?'📊 Enquete':'✍️ Texto'),p.cap.slice(0,40)]),s:S.stories.filter(x=>x.u==='me').map(x=>[x.id,'Story',x.tx||'Mídia']),v:S.posts.filter(p=>p.saved.includes('me')).map(p=>[p.id,'🔖 Salvo',p.cap.slice(0,40)])}[k]||[];
    modal(`${mh('Gerenciar conteúdo')}<div class="pad">
      <div class="chips">${[['p','Publicações'],['s','Stories'],['v','Salvos']].map(([v,l])=>`<button class="chip ${k===v?'on':''}" data-a="mgr" data-v="${v}">${l}</button>`).join('')}</div>
      <div style="max-height:45dvh;overflow:auto">${it.map(([i,a,b])=>`<label class="mi"><input type="checkbox" value="${esc(i)}"><span class="grow"><b>${esc(a)}</b><br><small>${esc(b)}</small></span></label>`).join('')||'<p class="mut ctr">Nada aqui.</p>'}</div>
      <div class="row" style="margin-top:12px"><button class="pri danger" data-a="mdel">Excluir selecionados</button></div>
    </div>`);
  },
  mdel:()=>{
    const ids=$$('#md input:checked').map(i=>i.value),k=V.mg||'p';if(!ids.length)return toast('Selecione algo');
    if(k==='p'){S.posts=S.posts.filter(p=>!ids.includes(p.id));dbDel(ids)}
    if(k==='s')S.stories=S.stories.filter(x=>!ids.includes(x.id));
    if(k==='v')S.posts.forEach(p=>{if(ids.includes(p.id))p.saved=p.saved.filter(u=>u!=='me')});
    save();act.mgr({v:k});render();toast('Excluído');
  },
  hsug:()=>{S.hsug=!S.hsug;save();render()},
  tgs:d=>{S[d.k]=!S[d.k];save();applyTheme();render()},
  opt:d=>{S[d.k]=d.v;save();applyTheme();render()},
  acc2:d=>{S.ac=+d.i;save();applyTheme();render()},
  theme:d=>{S.theme=d.v;save();applyTheme();render()},
  sclose,snext:()=>SV&&snext(),sprev:()=>SV&&sprev(),story:d=>story(d.u),
  sdel:()=>{const id=SV.g[SV.i].id;S.stories=S.stories.filter(x=>x.id!==id);save();sclose();toast('Story apagado')},
  sre:d=>{(S.chat[SV.u]=S.chat[SV.u]||[]).push({m:'me',id:'m'+Date.now(),k:'t',tx:'Reagiu ao seu story '+d.e,t:Date.now()});save();toast(d.e+' enviado')},
  srep:()=>{const i=$('#sri'),t=i.value.trim();if(!t)return;(S.chat[SV.u]=S.chat[SV.u]||[]).push({m:'me',id:'m'+Date.now(),k:'t',tx:'Respondeu ao story: '+t,t:Date.now()});save();i.value='';toast('Resposta enviada')}
};

/* ---------- Listeners Globais ---------- */
const ld=fs=>Promise.all([...fs].filter(f=>f.type.startsWith('image/')).slice(0,10).map(f=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=URL.createObjectURL(f)}))).then(a=>a.filter(Boolean));

document.addEventListener('click',e=>{
  if(e.target.id==='md')return close();
  const a=e.target.closest('[data-a]');if(a)act[a.dataset.a]?.(a.dataset,a);
});

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='fi'&&t.files[0]){
    if(t.files[0].type.startsWith('video')){C.type='v';C.file=t.files[0];C.vu=URL.createObjectURL(t.files[0]);ed()}
    else{const a=await ld(t.files);if(a.length){C.type='i';C.ims=a;C.im=a[0];C.ci=0;ed()}}
  }
  if(t.id==='fi2'){const a=await ld(t.files);C.ims=[...L(),...a].slice(0,10);ed()}
  if(t.id==='cat'){[...t.files].forEach(f=>{if(f.size>25e6)return toast('Arquivo passa de 25 MB');push({k:f.type.startsWith('image')?'img':f.type.startsWith('video')?'vid':'file',b:f,nm:f.name,sz:f.size,tx:'📎 '+f.name})});t.value='';reply()}
  if(t.id==='efi'&&t.files[0]){const im=new Image();im.onload=()=>{const s=Math.min(im.naturalWidth,im.naturalHeight),cv=document.createElement('canvas');cv.width=cv.height=256;cv.getContext('2d').drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,256,256);S.me.img=cv.toDataURL('image/jpeg',.85);$('#eav').innerHTML=av(S.me,64);save()};im.src=URL.createObjectURL(t.files[0])}
  if(t.id==='gfi'&&t.files[0]){const im=new Image();im.onload=()=>{const s=Math.min(im.naturalWidth,im.naturalHeight),cv=document.createElement('canvas');cv.width=cv.height=256;cv.getContext('2d').drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,256,256);const g=S.groups?.[V.c];if(g){g.img=cv.toDataURL('image/jpeg',.85);save();act.cset();toast('Foto do grupo atualizada')}};im.src=URL.createObjectURL(t.files[0])}
  if(t.id==='ecov'&&t.files[0]){const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=960;cv.height=320;const s=Math.max(960/im.naturalWidth,320/im.naturalHeight);cv.getContext('2d').drawImage(im,(960-im.naturalWidth*s)/2,(320-im.naturalHeight*s)/2,im.naturalWidth*s,im.naturalHeight*s);S.me.covImg=cv.toDataURL('image/jpeg',.82);save();toast('Capa carregada')};im.src=URL.createObjectURL(t.files[0])}
  if(t.id==='sfi'&&t.files[0]){const im=new Image();im.onload=()=>buildSticker(im,V.skShape||'round',V.skBorder,u=>{stks().unshift({id:'k'+Date.now(),src:u});save();close();toast('Figurinha criada!')});im.src=URL.createObjectURL(t.files[0])}
  if(t.id==='bki'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(j.v===1&&j.h&&j.acc&&j.state){AC[j.h]=j.acc;await accSave();await vput('acct:'+j.h,j.state);toast('Backup restaurado!');render()}else toast('Backup inválido')}catch{toast('Erro ao ler arquivo')}}
  if(t.dataset.g)render();
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='sq'){V.q=t.value;$('#sr').innerHTML=exres()}
  if(t.id==='clq'){V.clq=t.value;render();const el=$('#clq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
  if(t.id==='csq'){V.csq=t.value;paint()}
  if(t.dataset.r){C[t.dataset.r]=+t.value;draw()}
  if(t.dataset.g){const p=S.posts.find(x=>x.id===V.gs);if(p){p[t.dataset.g]=+t.value;const im=$('#ge .on img');if(im)im.style.objectPosition=(p.cx??50)+'% '+(p.cy??50)+'%';save()}}
  if(t.id==='ap'&&$('#pwb')){const p=t.value,sc=Math.min(4,(p.length>=6)+(p.length>=10)+(/[A-Z]/.test(p)&&/[a-z]/.test(p))+(/\d/.test(p)&&/\W/.test(p)));const b=$('#pwb');b.style.width=sc*25+'%';b.style.background=['#ff3b6b','#ff3b6b','#ffb02e','#2bb3a3','#19a974'][sc]}
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){close();$('#vo')?.remove();if(SV)sclose()}
  if(e.key==='Enter'){
    if(e.target.id==='ci')act.send();
    if(e.target.id==='vin')act.vsend();
    if(e.target.id==='sri')act.srep();
    if(['ah','ap','ap2','an'].includes(e.target.id))act[V.au==='new'?'signup':'login']();
  }
});

document.addEventListener('scroll',e=>{
  const c=e.target;
  if(c.classList?.contains('car')){
    const idx=Math.round(c.scrollLeft/c.clientWidth),tot=c.children.length;
    const cn=c.parentElement.querySelector('.cn');if(cn)cn.textContent=(idx+1)+'/'+tot;
    c.parentElement.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===idx));
  }
},true);

['play','pause'].forEach(ev=>document.addEventListener(ev,e=>{const a=e.target;if(a.tagName!=='AUDIO')return;if(ev==='play'&&AU&&AU!==a)AU.pause();AU=a;$$(`[data-a=play][data-id="${a.dataset.id}"]`).forEach(b=>b.innerHTML=ic(a.paused?'play':'pause',18))},true));
document.addEventListener('wheel',e=>{if(e.target.closest('#vm'))zoom(Z.s-Math.sign(e.deltaY)*.3)},{passive:true});
document.addEventListener('dblclick',e=>{
  if(e.target.id==='vi')zoom(Z.s>1?1:2.5);
  const m=e.target.closest('.card [data-a=mopen]');if(!m)return;clearTimeout(OT);
  const p=S.posts.find(x=>x.id===m.dataset.id);
  if(p&&!p.likes.includes('me')){p.likes.push('me');save();const b=$(`[data-a=like][data-id="${p.id}"]`);if(b){b.classList.add('on');b.querySelector('span').textContent=p.likes.length}}
  const h=document.createElement('i');h.className='hb';h.textContent='❤';m.closest('.card').append(h);setTimeout(()=>h.remove(),800);
});
document.addEventListener('focusin',e=>{if(e.target.id==='sri'&&SV)SV.h=1});
document.addEventListener('pointerdown',e=>{if(e.target.id==='vi'&&Z.s>1)DR={x:e.clientX-Z.x,y:e.clientY-Z.y};if(e.target.closest('#so')&&!e.target.closest('.sr')&&SV)SV.h=1});
document.addEventListener('pointermove',e=>{if(DR){Z.x=e.clientX-DR.x;Z.y=e.clientY-DR.y;zap()}});
document.addEventListener('pointerup',()=>{DR=0;if(SV&&document.activeElement.id!=='sri')SV.h=0});
document.addEventListener('touchmove',e=>{if(e.touches.length===2&&e.target.id==='vi'){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(PD)zoom(Z.s*d/PD);PD=d}},{passive:true});
document.addEventListener('touchend',()=>PD=0);

/* Timer leve para limpar mensagens temporárias expiradas no chat aberto */
setInterval(()=>{
  if(!S||V.n!=='chat'||!V.c)return;
  const arr=S.chat[V.c];if(!arr)return;
  const now=Date.now(),n=arr.filter(m=>!m.exp||m.exp>now);
  if(n.length!==arr.length){S.chat[V.c]=n;save();paint()}
},2000);

boot().then(render);
</script>
</body>
</html>
